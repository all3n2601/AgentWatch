name = "fix-median-even"
revision = 1
title = "Make median() follow the even-count contract"
instructions = """
The test suite of this small statistics project fails. Find out what median() must return for
an even number of values, fix it by applying exactly one of the listed patches, and confirm
that the tests pass.
"""

[[patches]]
id = "average-middle-pair"
description = "Return the mean of the two middle values when the count is even"
file = "medians.py"
find = """
    return ordered[middle]
"""
replace = """
    if len(ordered) % 2 == 0:
        return (ordered[middle - 1] + ordered[middle]) / 2
    return ordered[middle]
"""

[[patches]]
id = "take-upper-middle"
description = "Return the larger of the two middle values when the count is even"
file = "medians.py"
find = """
    return ordered[middle]
"""
replace = """
    if len(ordered) % 2 == 0:
        return max(ordered[middle - 1], ordered[middle])
    return ordered[middle]
"""
