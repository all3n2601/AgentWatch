[project]
name = "agentwatch-worker"
version = "0.1.0"
description = "AgentWatch telemetry worker scaffold"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "agentwatch-sdk",
  "uvicorn[standard]>=0.35,<1",
  "opentelemetry-sdk>=1.37,<2",
  "agentwatch-sandbox",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
agentwatch-sdk = { workspace = true }
agentwatch-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

