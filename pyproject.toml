[project]
name = "model-passport-python-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.15"

[tool.uv.workspace]
members = [
  "services/worker",
  "services/sandbox",
  "packages/sdk-python",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["services/worker/tests", "services/sandbox/tests"]

