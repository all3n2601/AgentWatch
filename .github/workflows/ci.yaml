name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentwatch_test
          POSTGRES_USER: agentwatch
          POSTGRES_PASSWORD: agentwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentwatch -d agentwatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTWATCH_TEST_DATABASE_URL: postgresql://agentwatch:agentwatch_test@localhost:5432/agentwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  data-validation:
    # The TFDV quality gate has its own environment (TensorFlow is too heavy for the shared
    # workspace) and supports CPython 3.13 on Linux x86_64 and macOS arm64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pipelines/validation/uv.lock
      - run: uv sync --project pipelines/validation --frozen
      - run: uv run --project pipelines/validation --frozen pytest pipelines/validation/tests

  data-versioning:
    # DVC has its own environment (about 120 packages with GCS support). Its end-to-end tests
    # drive the data commands through make, so the shared workspace environment is synced as
    # well. The data pipeline supports CPython 3.13 and 3.14, so both are tested here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a failure on one version must not hide the other's result
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pipelines/versioning/uv.lock
      - run: uv sync --all-packages --frozen
      - run: uv run --frozen pytest pipelines/data/tests
      - run: uv sync --project pipelines/versioning --frozen
      - run: uv run --project pipelines/versioning --frozen pytest pipelines/versioning/tests

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: gofmt -d apps/control-plane apps/cli
      - run: go vet ./apps/control-plane/... ./apps/cli/...
      - run: go test ./apps/control-plane/... ./apps/cli/...

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.gpu.yaml --profile llm config --quiet
