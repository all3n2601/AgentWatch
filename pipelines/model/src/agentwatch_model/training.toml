# training-v3: training-v2's LightGBM settings (chosen by tune-candidates on validation), trained
# with condition-balancing weights. bias-check (bias-v1) adopted the weighting on the validation
# split: it lowered the worst slice disparity past the declared margin within the declared
# log-loss trade-off. The test split decided nothing. Any change changes the version hash.
# Determinism settings (one thread, fixed seed, deterministic mode) are fixed in code.
version = "training-v3"

weight_by = "condition"

# Rounds are an upper bound; training stops early when the validation loss stops improving.
num_boost_round = 300
early_stopping_rounds = 30

# Resource classifier (multiclass log loss).
# Settings: best grid point.
[classifier]
feature_fraction = 0.8
lambda_l2 = 5.0
learning_rate = 0.1
min_data_in_leaf = 5
num_leaves = 31

# Excess-latency fraction regressor (L1 loss, matching the contract's MAE).
# Settings: best grid point.
[regressor]
feature_fraction = 1.0
lambda_l2 = 0.0
learning_rate = 0.03
min_data_in_leaf = 10
num_leaves = 15
