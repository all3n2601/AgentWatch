# registry-v2: when a pushed model may replace the registered champion. Every evaluated model is
# registered once per identity (training and calibration versions, split SHA-256, dataset version,
# classifier SHA-256) under the `candidate` alias; a rerun of the same model changes nothing. The
# `champion` alias moves to it only when it is eligible (no failed contract or calibration gate, no
# failed bias check on test, and not blocking promotion), was scored on the same split and dataset
# as the champion, and its test macro F1 is at least the champion's minus max_macro_f1_drop.
# Otherwise the champion is kept: that is the rollback. While every model blocks promotion
# (contract gates not evaluated), no version is champion.
version = "registry-v2"
model_name = "agentwatch-attribution"
max_macro_f1_drop = 0.0
