[project]
name = "agentwatch-model"
version = "0.1.0"
description = "AgentWatch attribution models: rule baseline evaluation against the evaluation contract"
requires-python = ">=3.13,<3.15"
dependencies = [
    "agentwatch-data",
    # LightGBM core API only (no scikit-learn wrapper). MIT. Needs OpenMP: libgomp on Linux,
    # libomp on macOS (not bundled).
    "lightgbm>=4.6,<5",
    "numpy>=2,<3",
    # Experiment tracking with a local SQLite backend. Apache-2.0 / MIT / MIT.
    "mlflow-skinny>=3.17,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
]

[tool.uv.sources]
agentwatch-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
