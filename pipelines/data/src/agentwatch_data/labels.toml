# Step label rules, frozen before any dataset is built.
# label_version fingerprints these values and the labeling code, so retuned labels are
# never silent. Comments and formatting do not change it.
version = "labels-v1.1"

[noise]
# A contended step is labeled with its resource only when its slowdown against the
# run's clean baseline mean exceeds max(min_seconds, stdev_multiplier * baseline stdev).
# The scoping report proposes 2-3 baseline standard deviations; 3 is the stricter end.
stdev_multiplier = 3.0
# Matches the 10 ms floor of the cpu-queue-v1 rule, so very stable baselines do not
# turn scheduler jitter into labels.
min_seconds = 0.01

# What each experiment kind applies in its "contended" condition. This is experiment
# design used for labeling and evaluation splits only; it is never a model feature.

[contention.cpu]
resource = "cpu_sandbox"
# A competing task is submitted ahead of the measured step to a single-worker pool.
injection_method = "worker_queue_blocker"

[contention.coding]
resource = "cpu_sandbox"
injection_method = "worker_queue_blocker"
