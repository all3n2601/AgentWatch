[project]
name = "agentwatch-data"
version = "0.1.0"
description = "AgentWatch step dataset pipeline: extraction, labeling, validation, and versioning"
requires-python = ">=3.13,<3.15"
dependencies = [
    "agentwatch-features",
    "agentwatch-worker",
    "pyarrow>=21,<23",
]

[tool.uv.sources]
agentwatch-features = { workspace = true }
agentwatch-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
