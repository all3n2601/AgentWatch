[project]
name = "agentwatch-features"
version = "0.1.0"
description = "Versioned step feature definitions shared by AgentWatch training and serving"
requires-python = ">=3.13,<3.15"
dependencies = [
  "agentwatch-sdk",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
agentwatch-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
