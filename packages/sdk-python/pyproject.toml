[project]
name = "agentwatch-sdk"
version = "0.1.0"
description = "Python SDK for AgentWatch"
requires-python = ">=3.13,<3.15"
# 2.12 is the first release that honors Field(exclude_if=...), which keeps an undeclared
# RunCreate.sampling_interval_seconds off the wire (2.11 silently serializes it as null).
dependencies = ["pydantic>=2.12,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

