# Receives vLLM's per-request OTLP spans and appends them, as OTLP JSON lines, to a file the agent
# runner reads after each run. Only the Compose network can reach the receiver; nothing is
# published on the host. Spans are evidence for one run's own model calls, joined by trace and
# parent span ID; see docs/adr/0007-vllm-request-traces-and-server-metrics.md.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 200ms

exporters:
  file/vllm:
    path: /traces/vllm-traces.jsonl
    # Bounded on disk: at most 4 files of 64 MB, oldest removed first.
    rotation:
      max_megabytes: 64
      max_backups: 3
    flush_interval: 200ms

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/vllm]
