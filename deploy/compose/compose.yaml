name: model-passport

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-model_passport}
      POSTGRES_USER: ${POSTGRES_USER:-model_passport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-model_passport_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-model_passport}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-model_passport_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-model_passport}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-model_passport_dev}
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.40.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"

  opa:
    image: openpolicyagent/opa:1.4.2-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    ports:
      - "8181:8181"
    volumes:
      - ../../policy:/policy:ro

volumes:
  postgres-data:
  minio-data:
